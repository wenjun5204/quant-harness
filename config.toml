# A-share daily paper-trading configuration.
# WARNING: paper trading validates process, not profitability — no return is guaranteed.

initial_cash = 100_000.0

# Stock pool: ~28 main-board large caps across 20+ sectors (all 10% price
# limit; sub-¥250/share so a round lot fits the 25% symbol cap at ¥100k).
# No 300xxx/688xxx (20% limit). 600036 doubles as the trading calendar.
symbols = [
    "600036", "601166",                    # banks
    "600030", "601318",                    # broker, insurance
    "000858", "000568", "600887", "603288",# liquor, dairy, condiments
    "000333", "000651", "600690",          # appliances
    "600276", "600196",                    # pharma
    "600900", "601088",                    # utility, coal
    "601899", "600019", "601857",          # metals, steel, oil
    "600309",                              # chemicals
    "601668", "600048",                    # construction, property
    "600104", "002714",                    # autos, agriculture
    "600031",                              # machinery
    "601006", "601919",                    # rail, shipping
    "600941", "002415", "000725",          # telecom, electronics, panels
]
reference_symbol = "600036"  # its bars double as the trading calendar

[fees]
commission_rate = 0.00025  # 万2.5
commission_min = 5.0       # per-order minimum, CNY
stamp_duty_rate = 0.0005   # sell-only
slippage_rate = 0.001

[risk]
max_symbol_weight = 0.25
max_total_exposure = 0.80
stop_loss = 0.08
drawdown_halt = 0.10

[strategy]
# Shipped default: equal-weight basket + 120-day pool trend filter (Faber/GTAA
# style). Chosen over momentum after an 8-year sweep (2019-2026, 29 symbols):
# no momentum configuration beat diversified buy-and-hold; the trend filter
# halves drawdowns in bear years at the cost of ~half the bull-year upside.
# Switch to "momentum_rotation" for research (params below).
name = "buy_hold"
market_filter_window = 120  # 0 disables the filter

# momentum_rotation research params (unused unless name = "momentum_rotation")
momentum_window = 60
top_k = 2
rank_buffer = 2
min_history = 60
min_momentum = 0.0
risk_adjusted = false

[paths]
state_dir = "state"
cache_dir = "data/cache"
reports_dir = "reports"

[data]
fetch_retries = 3
fetch_retry_sleep_s = 60
fetch_lookback_years = 8
price_limit_check = true
